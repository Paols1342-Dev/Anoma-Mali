name: Build AnomaMali UMD Layer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-build-tools

      - name: Build Shared Library (.so)
        run: |
          NDK_PATH=$ANDROID_HOME/ndk-bundle
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | tail -n 1)
          fi
          $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang \
          -shared -fPIC -O3 \
          Anoma_Mali.c \
          -Iumd \
          -o libanoma_mali.so \
          -lvulkan

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libanoma_mali.so
          path: libanoma_mali.so
          
