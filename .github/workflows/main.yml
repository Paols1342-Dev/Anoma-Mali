name: Compila Mesa Mali-G52
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Strumenti build
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            glslang-tools \
            ninja-build \
            pkg-config
          sudo pip install meson==1.4.0 pkgconfig

      - name: Compila driver
        run: |
          ROOT="/usr/aarch64-linux-gnu"
          echo "[binaries]" > cross.txt
          echo "c = 'aarch64-linux-gnu-gcc'" >> cross.txt
          echo "cpp = 'aarch64-linux-gnu-g++'" >> cross.txt
          echo "pkg-config = 'pkg-config'" >> cross.txt
          echo "[properties]" >> cross.txt
          echo "pkg_config_libdir = '$ROOT/lib/pkgconfig'" >> cross.txt
          echo "sys_root = '$ROOT'" >> cross.txt
          echo "[host_machine]" >> cross.txt
          echo "system = 'linux'" >> cross.txt
          echo "cpu_family = 'aarch64'" >> cross.txt
          echo "cpu = 'armv8-a'" >> cross.txt
          echo "endian = 'little'" >> cross.txt
          meson setup build/ --cross-file cross.txt \
            -Dplatforms=android \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers=panfrost \
            -Dbuildtype=release
          OUT="src/panfrost/vulkan/libvulkan_panfrost.so"
          ninja -C build/ $OUT

      - name: Genera JSON
        run: |
          CDIR="build/src/panfrost/vulkan"
          cd $CDIR
          cat << 'EOF' > meta.json
          {
            "schema_version": 1,
            "name": "Panfrost Mesa Devel",
            "version": "26.3.0",
            "description": "Custom compilation with unlocked extensions",
            "author": "Paolo1342-Dev",
            "api": "vulkan",
            "driverFile": "libvulkan_panfrost.so",
            "gpuVendor": "arm",
            "customDriverFeatures": [
              "VK_KHR_timeline_semaphore",
              "VK_EXT_descriptor_indexing",
              "VK_EXT_robustness2",
              "VK_EXT_vertex_attribute_divisor",
              "VK_EXT_conditional_rendering",
              "VK_EXT_conservative_rasterization",
              "VK_EXT_extended_dynamic_state",
              "VK_EXT_extended_dynamic_state2",
              "VK_EXT_shader_demote_to_helper_invocation",
              "VK_KHR_shader_float16_int8"
            ]
          }
          EOF

      - name: Carica Driver sbloccato
        uses: actions/upload-artifact@v4
        with:
          name: driver-panvk-sbloccato
          path: |
            build/src/panfrost/vulkan/libvulkan_panfrost.so
            build/src/panfrost/vulkan/meta.json
            
